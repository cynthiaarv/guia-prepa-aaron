name: Deploy Guía Prepa Aarón to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate PIENSE generator
        run: |
          node --check piense-generator.js
          node - <<'NODE'
          global.window=global;
          require('./piense-generator.js');
          const pool=global.generatePiensePool(800);
          const required=['Habilidad cognoscitiva','Español','Matemáticas','Inglés PIENSE'];
          for (const area of required) {
            if (!pool.some(q=>q.area===area)) throw new Error('Missing area: '+area);
          }
          if (pool.some(q=>!Array.isArray(q.options)||q.options.length!==4||q.answer<0||q.answer>3)) throw new Error('Invalid question shape');
          console.log('Generated',pool.length,'valid PIENSE questions across all four areas');
          NODE
      - name: Validate inline app JavaScript
        run: |
          python3 - <<'PY'
          import re, pathlib
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, flags=re.I)
          for i,s in enumerate(scripts):
              if s.strip():
                  pathlib.Path(f'/tmp/inline-{i}.js').write_text(s,encoding='utf-8')
                  print(f'/tmp/inline-{i}.js')
          PY
          for f in /tmp/inline-*.js; do node --check "$f"; done
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
